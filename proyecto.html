<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proyecto | Kevin Parra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/proyecto.css">
</head>

<body>

    <!-- TOPBAR -->
    <nav class="topbar-container">
        <div class="topbar">
            <!-- OPCIONES PARA COMPUTADORA -->
            <div class="topbar-options d-none d-lg-flex align-items-center gap-5">
                <a href="#" class="topbar-item">INICIO</a>
                <a href="#" class="topbar-item">SOBRE MÍ</a>
                <a href="#" class="topbar-item">HABILIDADES</a>
                <a href="#" class="topbar-item active">PORTAFOLIO</a>
            </div>

            <!-- TÍTULO DE LA SECCIÓN ACTIVA EN MÓVIL (Izquierda) -->
            <div class="d-flex d-lg-none align-items-center">
                <span class="topbar-mobile-title active">INICIO</span>
            </div>

            <!-- SECCIÓN PARA MÓVIL / TABLET (Derecha: Botón Hamburguesa) -->
            <div class="d-flex d-lg-none align-items-center gap-3">
                <button class="btn text-black p-1 border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" class="bi bi-list"
                        viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- MENÚ DESPLEGABLE PARA MÓVIL -->
        <div class="collapse d-lg-none" id="mobileMenu"
            style="background-color: #000000; border-bottom: 2px solid #000000 !important;">
            <div class="d-flex flex-column gap-3 py-3" style="padding-left: 1.25rem;">
                <a href="#" class="topbar-menu-item active text-white py-1">Inicio</a>
                <a href="#" class="topbar-menu-item text-white py-1">Sobre Mí</a>
                <a href="#" class="topbar-menu-item text-white py-1">Habilidades</a>
                <a href="#" class="topbar-menu-item text-white py-1">Portafolio</a>
            </div>
        </div>
    </nav>

    <main class="project-detail">
        <div class="projects-content">

            <a href="index.html#proyectos" class="back-link">← Volver a proyectos</a>

            <div id="pdContenido" hidden>
                <!-- Encabezado -->
                <header class="pd-header">
                    <p class="pd-eyebrow" id="pdTipo"></p>
                    <h1 class="pd-title" id="pdTitulo"></h1>
                    <p class="pd-lead" id="pdResumen"></p>
                    <div class="d-flex flex-wrap gap-2" id="pdTech"></div>
                </header>

                <div class="row g-5">
                    <!-- Columna principal -->
                    <div class="col-lg-8">
                        <!-- Galería -->
                        <section aria-label="Galería de imágenes" class="gallery">
                            <figure class="gallery-main">
                                <button type="button" class="gallery-open" id="galAbrir" aria-label="Ampliar imagen">
                                    <img id="galImg" src="" alt="">
                                </button>
                                <button type="button" class="gallery-nav prev" id="galPrev"
                                    aria-label="Imagen anterior">‹</button>
                                <button type="button" class="gallery-nav next" id="galNext"
                                    aria-label="Imagen siguiente">›</button>
                                <span class="gallery-count" id="galCount"></span>
                                <figcaption class="gallery-caption" id="galPie"></figcaption>
                            </figure>
                            <div class="gallery-thumbs" id="galThumbs"></div>
                        </section>

                        <section class="pd-section">
                            <h2 class="pd-h2">Descripción</h2>
                            <div id="pdDesc"></div>
                        </section>

                        <section class="pd-section">
                            <h2 class="pd-h2">Características</h2>
                            <ul class="pd-features" id="pdFeat"></ul>
                        </section>
                    </div>

                    <!-- Panel lateral -->
                    <aside class="col-lg-4">
                        <div class="pd-side">
                            <h2 class="pd-h2">Enlaces</h2>
                            <div class="d-grid gap-2 mb-4" id="pdLinks"></div>
                            <h2 class="pd-h2">Detalles</h2>
                            <dl class="pd-meta mb-0" id="pdMeta"></dl>
                        </div>
                    </aside>
                </div>

                <!-- Anterior / siguiente -->
                <nav class="pd-pager" id="pdPager" aria-label="Otros proyectos"></nav>
            </div>

            <p id="pdVacio" class="text-secondary" hidden>No encontramos ese proyecto.</p>
        </div>
    </main>

    <!-- Imagen ampliada -->
    <dialog id="lightbox" class="lightbox" aria-label="Imagen ampliada">
        <button type="button" class="lightbox-close" id="lbCerrar" aria-label="Cerrar">✕</button>
        <button type="button" class="gallery-nav prev" id="lbPrev" aria-label="Imagen anterior">‹</button>
        <img id="lbImg" src="" alt="">
        <button type="button" class="gallery-nav next" id="lbNext" aria-label="Imagen siguiente">›</button>
        <p class="lightbox-caption" id="lbPie"></p>
    </dialog>

    <script src="/js/proyecto.js"></script>
</body>

</html>
